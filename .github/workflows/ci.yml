name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: End-to-end demo
        run: bash scripts/demo.sh

  cgroup-v2:
    name: cgroup v2 smoke test (real kernel)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Run daemon as root with cgroups enabled
        run: |
          W=$(mktemp -d)
          sudo ./target/release/edgeforged --root "$W/state" --listen 127.0.0.1:9100 > "$W/log" 2>&1 &
          for _ in $(seq 50); do curl -sf http://127.0.0.1:9100/healthz && break; sleep 0.1; done
          ./target/release/edgeforge pack examples/detector -o "$W/detector.tar"
          ./target/release/edgeforge install "$W/detector.tar" --start
          sleep 3
          ./target/release/edgeforge list
          cat /sys/fs/cgroup/edgeforge/detector/memory.max
          cat /sys/fs/cgroup/edgeforge/detector/cpu.max
          test "$(cat /sys/fs/cgroup/edgeforge/detector/memory.max)" = "268435456"
          test "$(cat /sys/fs/cgroup/edgeforge/detector/cpu.max)" = "50000 100000"
          cat "$W/log"
